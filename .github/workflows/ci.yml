name: TaskFlow CI

on:
  push:
    branches:
      - main
      - feature/docker-setup

  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker images
        run: docker compose --env-file backend/.env.example build
